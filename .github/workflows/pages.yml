name: Deploy research dashboard

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pages.yml
      - site/**
      - package.json
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Validate published results file
        run: python -m json.tool site/results/index.json > /dev/null
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Build TypeScript dashboard
        run: npm run build:site
      - name: Check generated script
        run: node --check site/app.js
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v5
